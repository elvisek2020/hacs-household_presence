[project]
name = "hacs-household_presence"
version = "0.1.0"
description = "Household presence for Home Assistant: who is home, long absence and expected return."
requires-python = ">=3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PL", "D"]
ignore = [
  "D203",
  "D213",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "PLR0917",
  "PLR2004",
  "RUF001",
  "RUF003",
  "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D103"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["custom_components"]
